name: Update ATLAS Vistas Button

on:
  push:
    paths:
      - '.github/workflows/fix-logo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add presentation button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          marker = '<h2>ATLAS Vistas</h2>'
          button = '<a class="btn" href="atlas-vistas-presentation.html" target="_blank" rel="noopener noreferrer">Open Presentation</a>'
          start = s.index(marker)
          end = s.index('</article>', start)
          if button not in s[start:end]:
              actions = s.index('<div class="actions">', start)
              first = s.index('<a class="btn"', actions)
              s = s[:first] + button + s[first:]
              p.write_text(s)
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add ATLAS presentation button before PDF"
          git push
