name: Fix PayComp Header Logo

on:
  push:
    paths:
      - '.github/workflows/fix-logo.yml'

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified PayComp logo
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://sdmntprwestus3.oaiusercontent.com/files/00000000-93a0-81fd-94ed-76f36cc5f32f/raw?se=2026-09-18T05%3A44%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=6924eee2-5880-5aa4-b163-8286fffae3c4&skoid=b9a47e8b-72a2-4ed3-8028-a2a98c1a6142&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T18%3A11%3A43Z&ske=2026-09-18T18%3A11%3A43Z&sks=b&skv=2026-02-06&sig=YCsfxWhGG/bR6SDRkOPlMnraTpLnfGyzo9%2Bw27E56kE%3D' \
            -o paycomp-logo-top.png
          test "$(wc -c < paycomp-logo-top.png)" -gt 15000
          file paycomp-logo-top.png | grep -q 'PNG image data'
      - name: Commit corrected logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paycomp-logo-top.png
          git commit -m "Fix broken PayComp header logo"
          git push
