name: Publish IPPA business card images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-ippa-cards.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download the provided business card originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/ippa
          curl --fail --silent --show-error --location --retry 3 'https://at.adobe.com/f5ljPxHcM7EKeyZP' --output assets/ippa/troy-hefner-business-card.png
          curl --fail --silent --show-error --location --retry 3 'https://at.adobe.com/nlrhju9wwC2fBTpj' --output assets/ippa/johnny-cardenas-business-card.png
          test "$(file -b --mime-type assets/ippa/troy-hefner-business-card.png)" = "image/png"
          test "$(file -b --mime-type assets/ippa/johnny-cardenas-business-card.png)" = "image/png"
          test "$(stat -c %s assets/ippa/troy-hefner-business-card.png)" -gt 10000
          test "$(stat -c %s assets/ippa/johnny-cardenas-business-card.png)" -gt 10000
      - name: Commit card image assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ippa/troy-hefner-business-card.png assets/ippa/johnny-cardenas-business-card.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add original IPPA business card images'
            git push origin main
          fi
