name: Sync PayComp Replica

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-paycomp-replica.yml"
      - ".github/scripts/snapshot-paycomp.cjs"
  workflow_dispatch:

concurrency:
  group: paycomp-replica-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.61.1
          google-chrome --version

      - name: Capture live PayComp site
        env:
          OUT_DIR: website-rebuild
        run: node .github/scripts/snapshot-paycomp.cjs

      - name: Commit GitHub Pages preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website-rebuild
          git diff --cached --quiet || git commit -m "Sync exact PayComp website replica"
          git push origin main

      - name: Sync editable website-rebuild branch
        run: |
          rm -rf /tmp/rebuild
          cp -R website-rebuild /tmp/rebuild
          rm -rf node_modules package.json package-lock.json
          git checkout -B website-rebuild origin/website-rebuild
          find . -maxdepth 1 -type f ! -name 'REBUILD_README.md' -delete
          cp -R /tmp/rebuild/. .
          git add .
          git diff --cached --quiet || git commit -m "Sync exact PayComp website replica"
          git push origin website-rebuild
