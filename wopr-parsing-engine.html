<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061A44">
<title>WOPR Parsing Engine</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061A44}
body{display:grid;place-items:center}
video{display:block;width:100vw;height:100vh;object-fit:contain;background:#061A44}
.fallback{position:fixed;inset:auto 20px 20px 20px;text-align:center;font:700 14px/1.4 Arial,sans-serif;color:#fff;opacity:0;pointer-events:none;transition:opacity .2s}
.fallback.show{opacity:1;pointer-events:auto}
.fallback a{color:#06B0ED}
</style>
</head>
<body>
<video id="animation" autoplay muted loop playsinline preload="auto" aria-label="WOPR Parsing Engine animation">
  <source src="https://paycomp-my.sharepoint.com/:v:/p/dvonkleist/IQCZj_aPQQX7TJMdmqagEJdhARaRbFoe7sXxtFhamUzAkxM?download=1" type="video/mp4">
</video>
<div id="fallback" class="fallback">Animation did not start automatically. <a href="https://paycomp-my.sharepoint.com/:v:/p/dvonkleist/IQCZj_aPQQX7TJMdmqagEJdhARaRbFoe7sXxtFhamUzAkxM" target="_blank" rel="noopener noreferrer">Open the animation directly</a>.</div>
<script>
const video=document.getElementById('animation');
const fallback=document.getElementById('fallback');
function start(){video.muted=true;video.loop=true;const p=video.play();if(p&&typeof p.catch==='function'){p.catch(()=>fallback.classList.add('show'));}}
video.addEventListener('canplay',start,{once:true});
video.addEventListener('error',()=>fallback.classList.add('show'));
start();
</script>
</body>
</html>
