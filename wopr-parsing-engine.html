<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061A44">
<title>WOPR Parsing Engine</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061A44}
body{display:grid;place-items:center}
video{display:block;width:100vw;height:100vh;object-fit:contain;background:#061A44}
.start-overlay{position:fixed;inset:0;display:none;place-items:center;background:rgba(6,26,68,.42);z-index:5;cursor:pointer}
.start-overlay.show{display:grid}
.start-card{padding:18px 24px;border-radius:16px;background:rgba(6,26,68,.9);border:1px solid rgba(255,255,255,.22);box-shadow:0 18px 50px rgba(0,0,0,.28);color:#fff;font:800 16px/1.35 Arial,sans-serif;text-align:center}
.start-card span{display:block;margin-top:5px;font-size:12px;font-weight:600;color:#bfefff}
.fallback{position:fixed;inset:auto 20px 20px 20px;text-align:center;font:700 14px/1.4 Arial,sans-serif;color:#fff;opacity:0;pointer-events:none;transition:opacity .2s;z-index:6}
.fallback.show{opacity:1;pointer-events:auto}
.fallback a{color:#06B0ED}
</style>
</head>
<body>
<video id="animation" autoplay loop playsinline preload="auto" aria-label="WOPR Parsing Engine animation">
  <source src="https://paycomp-my.sharepoint.com/:v:/p/dvonkleist/IQCZj_aPQQX7TJMdmqagEJdhARaRbFoe7sXxtFhamUzAkxM?download=1" type="video/mp4">
</video>
<div id="startOverlay" class="start-overlay" role="button" tabindex="0" aria-label="Start animation with sound">
  <div class="start-card">Click to start with sound<span>Your browser blocked automatic audio playback.</span></div>
</div>
<div id="fallback" class="fallback">Animation could not be loaded. <a href="https://paycomp-my.sharepoint.com/:v:/p/dvonkleist/IQCZj_aPQQX7TJMdmqagEJdhARaRbFoe7sXxtFhamUzAkxM" target="_blank" rel="noopener noreferrer">Open the animation directly</a>.</div>
<script>
const video=document.getElementById('animation');
const overlay=document.getElementById('startOverlay');
const fallback=document.getElementById('fallback');

video.muted=false;
video.volume=1;
video.loop=true;

function playWithSound(){
  video.muted=false;
  video.volume=1;
  const p=video.play();
  if(p&&typeof p.then==='function'){
    p.then(()=>overlay.classList.remove('show')).catch(()=>overlay.classList.add('show'));
  }
}

function userStart(){
  video.muted=false;
  video.volume=1;
  video.play().then(()=>overlay.classList.remove('show')).catch(()=>fallback.classList.add('show'));
}

overlay.addEventListener('click',userStart);
overlay.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();userStart();}});
video.addEventListener('canplay',playWithSound,{once:true});
video.addEventListener('error',()=>fallback.classList.add('show'));
playWithSound();
</script>
</body>
</html>
