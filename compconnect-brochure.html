body{padding:18px}

.viewer{height:calc(100vh - 128px);min-height:650px;border:1px solid #cfe4f7;border-radius:22px;overflow:hidden;background:white;box-shadow:0 18px 50px rgba(7,42,105,.13)}
iframe{width:100%;height:100%;border:0;background:white}
@media(max-width:800px){body{padding:8px}.top{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}.brand img{width:190px}.viewer{height:calc(100vh - 190px);min-height:560px}}
